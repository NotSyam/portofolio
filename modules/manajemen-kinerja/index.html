          hash = hash.slice(0, 8);

            var s1 = rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10);
            var ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
            var temp1 = hash[7] + (rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25)) + ch + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + s0 + w[i - 7] + s1) | 0);

      /* =========================================================
         STATE & LOCK GATE MANAGEMENT
         ========================================================= */
      const STORAGE_KEY = "kemenag_pmk_lock_v1";
      let state = loadState();

      let unitTimerInterval = null;
      let unitTimeRemaining = 10;

      function computeStateSignature(data) {
        const payload = `${data.current}::${(data.done || []).join(',')}::${JSON.stringify(data.tasksDone || {})}`;
        return sha256(`${CRYPTO_SALT}::sig::${payload}`);
      }

      function loadState() {
        const defaults = { 
          current: 0, 
          done: [0], 
          tasksDone: { 0: true, 1: true }, 
          u2_principles: [],
          u4_cascading: [],
          u5_steps: [],
          u6_errors: [],
          u7_tips: [],
          u8_tabs: [0],
          u9_org: "baik",
          u10_tabs: [0],
          u11_boxes: [],
          u11_sim: false,
          u12_scenario: null,
          u13_matches: {},
          audioEnabled: false,
          userName: "",
          userSatker: "",
          pledgeSigned: false
        };
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed) {
              if (parsed.sig) {
                const expectedSig = computeStateSignature(parsed);
                if (parsed.sig === expectedSig) {
                  return Object.assign(defaults, parsed);
                } else {
                  console.warn("Manipulasi progres terdeteksi. Mengatur ulang ke status aman.");
                }
              } else {
                parsed.sig = computeStateSignature(parsed);
                return Object.assign(defaults, parsed);
              }
            }
          }
        } catch (e) {}
        defaults.sig = computeStateSignature(defaults);
        return defaults;
      }

      function saveState() {
        try {
          state.sig = computeStateSignature(state);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      function isDone(id) {
        return state.done.includes(id);
      }

      function isTaskDone(id) {
        if (!UNITS[id].reqTask) return true;
        if (isDone(id)) return true;
        return !!(state.tasksDone && state.tasksDone[id]);
      }

      function setTaskCompleted(id) {
        if (!state.tasksDone) state.tasksDone = {};
        state.tasksDone[id] = true;
        saveState();
        playTone('success');
        updateGateUI();
        showToast("Tugas interaksi selesai!", "success");
      }

      function canAccess(id) {
        if (id === 0 || id === 1) return true;
        return isDone(id - 1) || isDone(id) || id <= Math.max(...state.done) + 1;
      }

      function markDone(id) {
        if (!state.done.includes(id)) state.done.push(id);
        saveState();
        renderNavigation();
        updateProgressBar();
      }

      function updateProgressBar() {
        const pct = Math.round((state.done.length / UNITS.length) * 100);
        const fill = document.getElementById("progressFill");
        const label = document.getElementById("pctLabel");
        if (fill) fill.style.width = pct + "%";
        if (label) label.textContent = pct + "%";
      }

      function showToast(msg, type = "info") {
        const el = document.getElementById("toast");
        if (!el) return;

        const styles = {
          success: "bg-algae-dark text-white ring-2 ring-algae-light",
          error: "bg-rose-700 text-white ring-2 ring-rose-300",
          info: "bg-algae-deep text-white ring-2 ring-algae-base"
        }[type] || "bg-algae-dark text-white";

        el.className = `fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-sm font-semibold transition-all duration-500 transform ${styles}`;
        el.innerHTML = `
          <span class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold shrink-0">
            ${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}
          </span>
          <span>${msg}</span>
        `;

        el.classList.remove("translate-y-24", "opacity-0", "pointer-events-none");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => {
          el.classList.add("translate-y-24", "opacity-0", "pointer-events-none");
        }, 2500);
      }

      /* =========================================================
         GATE TIMER & STATUS CONTROLLER
         ========================================================= */
      function initUnitGateTimer(unitId) {
        if (unitTimerInterval) {
          clearInterval(unitTimerInterval);
          unitTimerInterval = null;
        }

        if (isDone(unitId) || unitId === UNITS.length - 1) {
          unitTimeRemaining = 0;
        } else {
          unitTimeRemaining = 10;
        }

        updateGateUI();

        if (unitTimeRemaining > 0) {
          unitTimerInterval = setInterval(() => {
            unitTimeRemaining--;
            updateGateUI();
            if (unitTimeRemaining <= 0) {
              clearInterval(unitTimerInterval);
              unitTimerInterval = null;
            }
          }, 1000);
        }
      }

      function updateGateUI() {
        const nextBtn = document.querySelector('[data-action="next"]');
        const gateStatus = document.getElementById("gateStatus");
        if (!nextBtn) return;

        const currentId = state.current;
        const taskCompleted = isTaskDone(currentId);
        const timeCompleted = unitTimeRemaining <= 0;

         ========================================================= */
      function renderNavigation() {
        const desktopNav = document.getElementById("desktopNav");
        const mobileNav = document.getElementById("mobileNav");
        if (!desktopNav || !mobileNav) return;

        const itemHtml = (u) => {
          const active = state.current === u.id;
          const completed = isDone(u.id);
          const accessible = canAccess(u.id);

          let badgeCls = "bg-algae-surface text-slate-500";
          if (active) badgeCls = "bg-algae-dark text-white font-bold";
          else if (completed) badgeCls = "bg-algae-base text-white";

          return `
            <button type="button" 
                    data-unit="${u.id}" 
                    ${accessible ? "" : "disabled"}
                    class="w-full group flex items-center justify-between p-2.5 rounded-2xl text-left transition-all duration-500 border ${
                      active 
                        ? "bg-algae-light/30 border-algae-base text-algae-deep shadow-sm font-extrabold" 
                        : completed 
                          ? "bg-white hover:bg-algae-canvas border-algae-surface text-slate-700 font-semibold" 
                          : accessible 
                            ? "bg-white hover:bg-algae-canvas border-transparent text-slate-500 font-semibold" 
                            : "opacity-40 cursor-not-allowed border-transparent text-slate-400 font-semibold"
                    }">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="w-6 h-6 rounded-xl text-[11px] font-mono flex items-center justify-center shrink-0 ${badgeCls} transition-colors">
                  ${completed && !active ? "✓" : String(u.id).padStart(2, "0")}
                </span>
                <span class="text-xs truncate ${active ? "font-extrabold text-algae-deep" : "text-slate-700"}">
                  ${u.nav}
                </span>
              </div>
              
              <div class="shrink-0 text-slate-400 group-hover:text-algae-dark group-hover:scale-110 transition-transform">
                ${renderSvg(u.icon, "w-4 h-4")}
              </div>
            </button>
          `;
        };

        const html = UNITS.map(itemHtml).join("");
        desktopNav.innerHTML = html;
        mobileNav.innerHTML = html;

        const clickHandler = (e) => {
          const btn = e.target.closest("[data-unit]");
          if (!btn || btn.hasAttribute("disabled")) return;
          playTone('click');
          navigateTo(Number(btn.dataset.unit));
          document.getElementById("mobileDrawer").classList.add("hidden");
        };

        desktopNav.onclick = clickHandler;
        mobileNav.onclick = clickHandler;
      }

      function navigateTo(id) {
        if (id < 0 || id >= UNITS.length) return;
        state.current = id;
        saveState();
        renderNavigation();
        renderStage();
        updateProgressBar();
        initUnitGateTimer(id);
        playUnitNarration(id);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

                </button>
                ${passed ? `
                  <button type="button" data-action="next" class="px-6 py-2.5 rounded-2xl bg-algae-dark text-white text-xs font-bold hover:bg-algae-deep shadow-md transition-all">
                    Lanjut ke Penutup
                  </button>
                ` : ""}
              </div>
            </div>
          `;

          const retryBtn = document.getElementById("retryQuizBtn");
          if (retryBtn) {
            retryBtn.onclick = () => {
              playTone('click');
              resetQuizState();
              renderQuizStage();
            };
          }

          const nextToPenutupBtn = container.querySelector('[data-action="next"]');
          if (nextToPenutupBtn) {
            nextToPenutupBtn.onclick = () => {
              playTone('click');
              markDone(14);
              navigateTo(15);
            };
          }
          return;
        }

        const cur = QUIZ_ITEMS[quizState.index];
        const isAnswered = quizState.userAnswers[quizState.index] !== undefined;
        const userSelected = quizState.userAnswers[quizState.index];
        const userAnsHash = isAnswered ? sha256(`${CRYPTO_SALT}::quiz_${quizState.index}::${userSelected}`) : null;
        const isUserCorrect = isAnswered && (userAnsHash === cur.hash);
        const decryptedExplain = isUserCorrect ? decryptHex(cur.encExplain, cur.hash) : "Jawaban kurang tepat. Cermati kembali materi orientasi pada unit sebelumnya sebelum melanjutkan.";

        const dots = QUIZ_ITEMS.map((item, i) => {
          let cls = "bg-algae-surface text-slate-600";
          if (i === quizState.index) {
            cls = "bg-algae-base text-white ring-2 ring-algae-light font-bold";
          } else if (quizState.userAnswers[i] !== undefined) {
            const ansHash = sha256(`${CRYPTO_SALT}::quiz_${i}::${quizState.userAnswers[i]}`);
            cls = (ansHash === item.hash) ? "bg-algae-dark text-white" : "bg-rose-500 text-white";
          }
          return `<span class="w-6 h-6 rounded-lg text-[11px] font-mono flex items-center justify-center ${cls}">${i + 1}</span>`;
        }).join("");

        container.innerHTML = `
          <div>
            <div class="flex items-center justify-between pb-3 border-b border-algae-surface mb-4">
              <span class="text-xs font-extrabold text-algae-deep uppercase tracking-wider">Soal ${quizState.index + 1} dari ${QUIZ_ITEMS.length}</span>
              <div class="flex items-center gap-1.5">${dots}</div>
            </div>

            <div class="p-5 rounded-3xl bg-algae-surface/50 border border-algae-surface mb-4">
              <h3 class="text-sm sm:text-base font-extrabold text-algae-deep leading-snug">${cur.q}</h3>
            </div>

            <div class="space-y-2.5 mb-4" id="quizOptions">
              ${cur.options.map((opt, optIdx) => {
                let optStyle = "bg-white hover:bg-algae-canvas border-slate-200 text-slate-700";
                const optHash = sha256(`${CRYPTO_SALT}::quiz_${quizState.index}::${optIdx}`);
                const isThisOptCorrect = (optHash === cur.hash);

                if (isAnswered) {
                  if (isThisOptCorrect) {
                    optStyle = "bg-algae-light/40 border-algae-base text-algae-deep font-extrabold";
                  } else if (optIdx === userSelected && !isUserCorrect) {
                    optStyle = "bg-rose-50 border-rose-300 text-rose-800 font-extrabold";
                  } else {
                    optStyle = "bg-white opacity-40 border-slate-200 text-slate-400";
                  }
                }
                return `
                  <button type="button" 
                          data-opt="${optIdx}" 
                          ${isAnswered ? "disabled" : ""}
                          class="w-full text-left p-3.5 rounded-2xl border text-xs sm:text-sm font-medium transition-all flex items-center justify-between ${optStyle}">
                    <span>${opt}</span>
                    ${isAnswered && isThisOptCorrect ? `<span class="font-bold text-algae-dark text-xs">✓ Benar</span>` : ""}
                    ${isAnswered && optIdx === userSelected && !isUserCorrect ? `<span class="font-bold text-rose-600 text-xs">✕ Salah</span>` : ""}
                  </button>
                `;
              }).join("")}
            </div>

            ${isAnswered ? `
              <div class="p-4 rounded-2xl ${isUserCorrect ? "bg-algae-light/30 border border-algae-base/40 text-algae-deep" : "bg-rose-50 border border-rose-200 text-rose-900"} text-xs leading-relaxed mb-4 font-medium">
                <strong>Pembahasan Regulasi:</strong> ${decryptedExplain}
              </div>
            ` : ""}
          </div>

          <div class="pt-4 border-t border-algae-surface flex items-center justify-between">
            <button type="button" id="prevQuizBtn" ${quizState.index === 0 ? "disabled" : ""} class="px-4 py-2 rounded-2xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-algae-surface disabled:opacity-30 disabled:cursor-not-allowed">
              ← Soal Sebelumnya
            </button>
            
            ${isAnswered ? `
              <button type="button" id="nextQuizBtn" class="px-6 py-2.5 rounded-2xl bg-algae-dark text-white text-xs font-bold hover:bg-algae-deep shadow-md transition-all">
                ${quizState.index === QUIZ_ITEMS.length - 1 ? "Lihat Hasil Kuis" : "Soal Selanjutnya →"}
              </button>
            ` : `<span class="text-[11px] text-slate-400 italic">Pilih satu opsi jawaban</span>`}
          </div>
        `;

        const options = container.querySelectorAll("[data-opt]");
        options.forEach(btn => {
          btn.onclick = () => {
            const picked = Number(btn.dataset.opt);
            quizState.userAnswers[quizState.index] = picked;
            const candidateHash = sha256(`${CRYPTO_SALT}::quiz_${quizState.index}::${picked}`);
            if (candidateHash === cur.hash) {
              quizState.score++;
              playTone('success');
              showToast("Jawaban Benar!", "success");
            } else {
              playTone('error');
              showToast("Jawaban Kurang Tepat", "error");
            }
            renderQuizStage();
          };
        });

        const nextBtn = document.getElementById("nextQuizBtn");
        if (nextBtn) {
          nextBtn.onclick = () => {
            playTone('click');
            if (quizState.index < QUIZ_ITEMS.length - 1) {
              quizState.index++;
              renderQuizStage();
            } else {
              quizState.isFinished = true;
              renderQuizStage();
            }
          };
        }

        const prevBtn = document.getElementById("prevQuizBtn");
        if (prevBtn) {
          prevBtn.onclick = () => {
            playTone('click');
            if (quizState.index > 0) {
              quizState.index--;
              renderQuizStage();
            }
          };
        }
      }

      /* =========================================================
         STAGE EVENT HANDLERS & ANIMATIONS
         ========================================================= */
      function renderStage() {
        const stage = document.getElementById("stage");
        const unit = UNITS[state.current];
        if (!stage || !unit) return;

        const renderer = UNIT_RENDERERS[unit.key];
        stage.innerHTML = renderer ? renderer() : `<p class="text-sm text-slate-500">Unit belum tersedia.</p>`;

        bindStageEvents(unit.key);
        updateAudioUI();
      }

      function bindStageEvents(key) {
        const stage = document.getElementById("stage");

        // Global Navigation Triggers
        stage.querySelectorAll('[data-action="start"]').forEach(b => {
          b.onclick = () => { 
            playTone('click');
            markDone(0); 
            setTaskCompleted(0);
            state.audioEnabled = true;
            saveState();
            updateAudioUI();
            navigateTo(1); 
          };
        });

        // Cover Audio Preview Button
        const coverAudioBtn = stage.querySelector("#coverAudioBtn");
        if (coverAudioBtn) {
          coverAudioBtn.onclick = () => {
            playTone('click');
            state.audioEnabled = true;
            saveState();
            updateAudioUI();
            playUnitNarration(0, true);
            showToast("Memutar narasi pengantar...", "info");
          };
        }

        // Stage Header Audio Pill Toggle
        const stageAudioBtn = stage.querySelector("#stageAudioToggleBtn");
        if (stageAudioBtn) {
          stageAudioBtn.onclick = () => {
            playTone('click');
            state.audioEnabled = !state.audioEnabled;
            saveState();
            updateAudioUI();
            if (state.audioEnabled) {
              playUnitNarration(state.current, true);
              showToast("Audio narasi aktif", "success");
            } else {
              if (audioPlayer) audioPlayer.pause();
              showToast("Audio narasi dimatikan", "info");
            }
          };
        }

        stage.querySelectorAll('[data-action="next"]').forEach(b => {
          b.onclick = () => {
            if (state.current === UNITS.length - 1) {
              playTone('success');
              markDone(state.current);
              navigateTo(0);
              return;
            }
            if (isTaskDone(state.current) && unitTimeRemaining <= 0) {
              playTone('click');
              markDone(state.current);
              navigateTo(state.current + 1);
            }
          };
        });

        stage.querySelectorAll('[data-action="prev"]').forEach(b => {
          b.onclick = () => {
            playTone('click');
            navigateTo(state.current - 1);
          };
        });

        stage.querySelectorAll('[data-action="restart"]').forEach(b => {
          b.onclick = () => {
            playTone('click');
            state = { 
              current: 0, 
              done: [0], 
              tasksDone: { 0: true, 1: true }, 
              u2_principles: [],
              u4_cascading: [],
              u5_steps: [],
              u6_errors: [],
              u7_tips: [],
              u8_tabs: [0],
              u9_org: "baik",
              u10_tabs: [0],
              u11_sim: false,
              u12_scenario: null,
              u13_matches: {},
              audioEnabled: false,
              userName: "",
              userSatker: "",
              pledgeSigned: false
            };
            resetQuizState();
            saveState();
            navigateTo(0);
            showToast("Progres diatur ulang", "info");
          };
        });

        stage.querySelectorAll('[data-jump]').forEach(b => {
          b.onclick = () => {
            playTone('click');
            navigateTo(Number(b.dataset.jump));
          };
        });

        // UNIT 2: 5 Prinsip Cards Click Tracker
        if (key === "prinsip") {
          if (!state.u2_principles) state.u2_principles = [];
          const counterLabel = document.getElementById("u2CounterLabel");

          stage.querySelectorAll(".principle-card").forEach(card => {
            const pid = card.dataset.pid;
            if (state.u2_principles.includes(pid) || isTaskDone(2)) {
              card.classList.add("border-algae-base", "bg-algae-light/10");
              const status = card.querySelector(".p-status");
              if (status) {
                status.className = "text-xs font-bold text-algae-dark flex items-center gap-1";
                status.innerHTML = `${renderSvg("check", "w-3 h-3 text-algae-base")} Dipelajari`;
              }
            }

            card.onclick = () => {
              playTone('click');
              card.classList.add("border-algae-base", "bg-algae-light/10");
              const status = card.querySelector(".p-status");
              if (status) {
                status.className = "text-xs font-bold text-algae-dark flex items-center gap-1";
                status.innerHTML = `${renderSvg("check", "w-3 h-3 text-algae-base")} Dipelajari`;
              }
              if (!state.u2_principles.includes(pid)) {
                state.u2_principles.push(pid);
                saveState();
              }
              if (counterLabel) {
                counterLabel.textContent = `Eksplorasi (${Math.min(state.u2_principles.length, 5)}/5)`;
              }
              if (state.u2_principles.length >= 5) {
                setTaskCompleted(2);
              }
            };
          });

          if (isTaskDone(2) && counterLabel) {
            counterLabel.textContent = "Eksplorasi (5/5) ✓";
          }
        }

        // UNIT 3: Micro-Quiz Unit 3
        if (key === "perencanaan") {
          const quizBtns = stage.querySelectorAll("#microQuizUnit3 button");
          const fb = document.getElementById("feedbackUnit3");
          const CORRECT_U3_IDX = "1"; // Opsi B: Penetapan & Klarifikasi Ekspektasi Pimpinan
          const expectedU3Hash = sha256(`${CRYPTO_SALT}::unit_3::1`);

          function applyCorrectU3State() {
            quizBtns.forEach(b => {
              b.disabled = true;
              if (b.dataset.idx === CORRECT_U3_IDX) {
                b.className = "p-3 bg-algae-light/40 border-2 border-algae-base text-algae-deep rounded-2xl text-xs font-extrabold text-left shadow-sm flex items-center justify-between";
                b.innerHTML = `<span>B. Penetapan & Klarifikasi Ekspektasi Pimpinan</span> <span class="text-algae-dark font-mono text-[11px] bg-white/90 px-2 py-0.5 rounded-lg border border-algae-base/40 shadow-sm">✓ Tepat</span>`;
              } else {
                b.className = "p-3 bg-algae-surface/40 border border-slate-200 text-slate-400 rounded-2xl text-xs text-left opacity-60";
              }
            });
            if (fb) {
              fb.classList.remove("hidden");
              fb.className = "text-xs mt-3 font-bold text-algae-dark p-3.5 rounded-2xl bg-algae-light/25 border border-algae-base/40 animate-fade-enter";
              fb.innerHTML = "<div class='flex items-start gap-2'><span class='text-base leading-none'>✓</span><div><strong>Jawaban Tepat!</strong> Output esensial dari Dialog Kinerja adalah penetapan & klarifikasi ekspektasi pimpinan terhadap capaian hasil kerja riil dan perilaku kerja BerAKHLAK yang disepakati bersama.</div></div>";
            }
          }

          if (isTaskDone(3)) {
            applyCorrectU3State();
          }

          quizBtns.forEach(btn => {
            btn.onclick = () => {
              const pickedIdx = btn.dataset.idx;
              const isCorrect = (pickedIdx === CORRECT_U3_IDX) || (sha256(`${CRYPTO_SALT}::unit_3::${pickedIdx}`) === expectedU3Hash);

              if (isCorrect) {
                playTone('success');
                applyCorrectU3State();
                setTaskCompleted(3);
                showToast("Jawaban Tepat! Silakan lanjut.", "success");
              } else {
                playTone('error');
                btn.className = "p-3 bg-rose-50 border-2 border-rose-400 text-rose-800 rounded-2xl text-xs font-bold text-left transition-all";
                if (fb) {
                  fb.classList.remove("hidden");
                  fb.className = "text-xs mt-3 font-bold text-rose-700 p-3 rounded-2xl bg-rose-50 border border-rose-200 animate-fade-enter";
                  fb.innerHTML = "<div class='flex items-start gap-2'><span class='text-base leading-none'>✕</span><div><strong>Kurang tepat.</strong> Dialog kinerja bukan untuk memotong tunjangan atau mendiskusikan cuti pribadi, melainkan untuk menyepakati ekspektasi hasil dan perilaku kerja bersama atasan. <em>Silakan pilih jawaban yang tepat!</em></div></div>";
                }
                showToast("Kurang tepat, silakan coba opsi yang benar!", "error");
              }
            };
          });
        }

        // UNIT 4: Cascading Tree Simulator (\u2b50 Fitur Klien 1)
        if (key === "cascading") {
          const CORRECT_ORDER = ["tier1", "tier2", "tier3", "tier4", "tier5"];
          let slotsData = [null, null, null, null, null];

          if (state.u4_cascading && Array.isArray(state.u4_cascading) && state.u4_cascading.length === 5) {
            slotsData = [...state.u4_cascading];
          }

          const pool = document.getElementById("cascadingPool");
          const badge = document.getElementById("cascadingBadge");
          const resetBtn = document.getElementById("resetCascadingBtn");
          const autoAlignBtn = document.getElementById("autoAlignCascadingBtn");
          const diagram = document.getElementById("cascadingDiagram");

          const TIER_META = {
            tier1: { name: "RPJPN (2025-2045) & RPJMN", reg: "UU No. 59 Tahun 2024" },
            tier2: { name: "Renstra Kemenag (2025-2029)", reg: "Permen PPN No. 10/2023" },
            tier3: { name: "Perjanjian Kinerja (PK) Pimpinan", reg: "Rencana Kerja Tahunan" },
            tier4: { name: "SKP JPT / Pimpinan Unit Mandiri", reg: "PP 30/2019 jo PermenPANRB 6/2022" },
            tier5: { name: "SKP JA & SKP JF (PPPK)", reg: "Intervensi RHK Individu" }
          };

          function updateCascadingUI() {
            const usedTiers = slotsData.filter(Boolean);

            if (pool) {
              pool.querySelectorAll(".tier-btn").forEach(btn => {
                const tid = btn.getAttribute("data-tier");
                const isUsed = usedTiers.includes(tid);
                if (isUsed) {
                  btn.classList.add("opacity-30", "pointer-events-none", "bg-slate-100", "border-dashed");
                  btn.classList.remove("hover:border-algae-base", "hover:bg-algae-surface/30", "bg-white");
                } else {
                  btn.classList.remove("opacity-30", "pointer-events-none", "bg-slate-100", "border-dashed");
                  btn.classList.add("hover:border-algae-base", "hover:bg-algae-surface/30", "bg-white");
                }
              });
            }

            const slotEls = document.querySelectorAll(".slot-box");
            slotEls.forEach((slot, idx) => {
              const assignedTier = slotsData[idx];
              if (assignedTier) {
                const isCorrect = (assignedTier === CORRECT_ORDER[idx]);
                const meta = TIER_META[assignedTier] || { name: assignedTier, reg: "" };
                slot.className = `p-3.5 rounded-2xl border-2 flex items-center justify-between transition-all cursor-pointer shadow-sm slot-box ${
                  isCorrect ? "border-emerald-500 bg-emerald-50/70" : "border-amber-400 bg-amber-50/70"
                }`;
                slot.innerHTML = `
                  <div class="flex items-center gap-3">
                    <span class="w-7 h-7 rounded-xl ${isCorrect ? "bg-emerald-600" : "bg-amber-600"} text-white font-mono text-xs font-bold flex items-center justify-center shadow-sm">${idx + 1}</span>
                    <div>
                      <span class="text-[10px] font-mono font-extrabold ${isCorrect ? "text-emerald-700" : "text-amber-800"} block">${meta.reg}</span>
                      <strong class="text-xs font-bold text-slate-800 block">${meta.name}</strong>
                    </div>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold ${isCorrect ? "text-emerald-700" : "text-amber-700"}">
                      ${isCorrect ? "Tepat \u2713" : "Posisi Belum Tepat"}
                    </span>
                    <span class="text-[11px] text-slate-400 hover:text-rose-600 ml-1 px-2 py-0.5 rounded bg-white/80 border border-slate-200 shadow-sm font-semibold">\u2715 Batal</span>
                  </div>
                `;
              } else {
                slot.className = "p-3 rounded-2xl border-2 border-dashed border-slate-200 bg-white flex items-center justify-between slot-box transition-all cursor-pointer hover:border-slate-300";
                slot.innerHTML = `
                  <div class="flex items-center gap-3">
                    <span class="w-7 h-7 rounded-xl bg-slate-200 text-slate-500 font-mono text-xs font-bold flex items-center justify-center">${idx + 1}</span>
                    <span class="text-xs font-mono font-bold text-slate-400">Tingkat ${idx + 1}: Kosong</span>
                  </div>
                  <span class="text-xs text-slate-400">Klik kartu di atas atau seret ke sini...</span>
                `;
              }
            });

            const filledCount = usedTiers.length;
            if (badge) {
              badge.textContent = `Selesaikan Susunan (${filledCount}/5)`;
            }

            if (filledCount === 5) {
              const isAllCorrect = slotsData.every((tid, i) => tid === CORRECT_ORDER[i]);
              if (isAllCorrect) {
                playTone('fanfare');
                confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
                if (badge) {
                  badge.className = "text-xs font-mono font-bold text-emerald-800 px-3 py-1 bg-emerald-100 border border-emerald-300 rounded-full animate-pulse";
                  badge.textContent = "Cascading Sempurna (5/5) \u2713";
                }
                if (diagram) diagram.classList.remove("hidden");
                state.u4_cascading = [...slotsData];
                saveState();
                setTaskCompleted(4);
                showToast("Penyelarasan Pohon Kinerja Berhasil (5/5)!", "success");
              } else {
                playTone('error');
                if (badge) {
                  badge.className = "text-xs font-mono font-bold text-amber-800 px-3 py-1 bg-amber-100 border border-amber-300 rounded-full";
                  badge.textContent = "Urutan Belum Tepat - Klik slot untuk membatalkan";
                }
                showToast("Urutan belum tepat. Klik slot yang salah untuk membatalkan.", "error");
              }
            } else {
              if (diagram && !isTaskDone(4)) diagram.classList.add("hidden");
            }
          }

          // Card clicking -> places in first empty slot
          if (pool) {
            pool.querySelectorAll(".tier-btn").forEach(btn => {
              btn.onclick = () => {
                const tid = btn.getAttribute("data-tier");
                if (slotsData.includes(tid)) return;
                const emptySlotIdx = slotsData.findIndex(s => s === null);
                if (emptySlotIdx === -1) return;
                playTone('click');
                slotsData[emptySlotIdx] = tid;
                state.u4_cascading = [...slotsData];
                saveState();
                updateCascadingUI();
              };

              btn.ondragstart = (e) => {
                const tid = btn.getAttribute("data-tier");
                e.dataTransfer.setData("text/plain", tid);
                btn.classList.add("opacity-50");
              };
              btn.ondragend = () => {
                btn.classList.remove("opacity-50");
              };
            });
          }

          // Slot clicking & dropping
          const slotEls = document.querySelectorAll(".slot-box");
          slotEls.forEach((slot, slotIdx) => {
            slot.onclick = () => {
              if (slotsData[slotIdx]) {
                playTone('click');
                slotsData[slotIdx] = null;
                state.u4_cascading = [...slotsData];
                saveState();
                updateCascadingUI();
              }
            };

            slot.ondragover = (e) => {
              e.preventDefault();
              slot.classList.add("border-algae-base", "bg-algae-light/20");
            };
            slot.ondragleave = () => {
              slot.classList.remove("border-algae-base", "bg-algae-light/20");
            };
            slot.ondrop = (e) => {
              e.preventDefault();
              slot.classList.remove("border-algae-base", "bg-algae-light/20");
              const draggedTid = e.dataTransfer.getData("text/plain");
              if (!draggedTid) return;
              playTone('click');
              const existingIdx = slotsData.indexOf(draggedTid);
              if (existingIdx !== -1) {
                slotsData[existingIdx] = null;
              }
              slotsData[slotIdx] = draggedTid;
              state.u4_cascading = [...slotsData];
              saveState();
              updateCascadingUI();
            };
          });

          if (resetBtn) {
            resetBtn.onclick = () => {
              playTone('click');
              slotsData = [null, null, null, null, null];
              state.u4_cascading = [];
              if (state.tasksDone) delete state.tasksDone[4];
              saveState();
              if (diagram) diagram.classList.add("hidden");
              updateCascadingUI();
              showToast("Urutan diatur ulang", "info");
            };
          }

          if (autoAlignBtn) {
            autoAlignBtn.onclick = () => {
              playTone('click');
              slotsData = [...CORRECT_ORDER];
              state.u4_cascading = [...slotsData];
              saveState();
              updateCascadingUI();
            };
          }

          if (isTaskDone(4)) {
            slotsData = [...CORRECT_ORDER];
            if (diagram) diagram.classList.remove("hidden");
          }
          updateCascadingUI();
        }

        // UNIT 5: 8 Tahapan SKP Accordion
        if (key === "tahapan") {
          if (!state.u5_steps) state.u5_steps = [];
          const badge = document.getElementById("u5ChecklistBadge");
          const container = document.getElementById("skpStepsContainer");
          const toggleAllBtn = document.getElementById("toggleAllStepsBtn");

          function updateStepUI() {
            if (badge) {
              const count = Math.min(state.u5_steps.length, 8);
              badge.textContent = `Telaah (${count}/8)`;
              if (count >= 8 || isTaskDone(5)) {
                badge.className = "text-xs font-mono font-bold text-emerald-800 px-3 py-1 bg-emerald-100 border border-emerald-300 rounded-full";
                badge.textContent = "Telaah Lengkap (8/8) \u2713";
              }
            }
          }

            "6": {
              name: "Box 6: High Performer (Pekerja Keras Unggul)",
              color: "emerald",
              axis: "Kinerja: Di Atas Ekspektasi | Potensi: Sedang",
              desc: "Pegawai pekerja keras (*workhorse*) yang sangat andal mengeksekusi tugas operasional melampaui target, namun potensi kepemimpinan strategisnya berada di level sedang.",
              actions: [
                "Dipertahankan dan diapresiasi di posisi operasional inti unit kerja.",
                "Diberikan penghargaan kinerja tahunan (*reward*) dan pengayaan tugas (*job enrichment*).",
                "Diberikan pelatihan kepemimpinan untuk mengembangkan potensinya ke level lebih tinggi."
              ]
            },
            "5": {
              name: "Box 5: Core Performer (Pilar Utama Organisasi)",
              color: "blue",
              axis: "Kinerja: Sesuai Ekspektasi | Potensi: Sedang",
              desc: "Kelompok mayoritas pegawai yang stabil, memenuhi seluruh ekspektasi hasil kerja dan perilaku BerAKHLAK secara konsisten sesuai uraian tugas.",
              actions: [
                "Menjadi tulang punggung operasional pelayanan publik kantor sehari-hari.",
                "Diberikan pelatihan peningkatan kompetensi berkelanjutan (Bangkom minimal 20 JP/tahun).",
                "Dipertahankan dengan pemeliharaan motivasi kerja dan lingkungan kondusif."
              ]
            },
            "4": {
              name: "Box 4: Dilemma (Inkonsisten / Perlu Bimbingan)",
              color: "amber",
              axis: "Kinerja: Di Bawah Ekspektasi | Potensi: Sedang",
              desc: "Pegawai dengan potensi rata-rata namun gagal memenuhi target minimal kinerja yang ditetapkan atasan.",
              actions: [
                "Wajib menyusun rencana perbaikan kinerja (Program Bimbingan Kinerja).",
                "Pemantauan berkala setiap bulan oleh atasan langsung.",
                "Bila dalam 6 bulan tidak ada peningkatan, dipertimbangkan sanksi atau relokasi."
              ]
            },
            "3": {
              name: "Box 3: Effective Specialist (Pakar Teknis)",
              color: "blue",
              axis: "Kinerja: Di Atas Ekspektasi | Potensi: Rendah",
              desc: "Pegawai spesialis teknis yang kinerjanya sangat prima pada lingkup tugasnya, namun tidak tertarik atau tidak memiliki kapasitas ke arah peran manajerial.",
              actions: [
                "Ditempatkan di jalur Jabatan Fungsional (JF) keahlian/keterampilan tanpa beban manajerial.",
                "Diapresiasi atas produktivitas hasil kerja teknis spesifiknya.",
                "Dilibatkan sebagai mentor teknis bagi rekan kerja baru."
              ]
            },
            "2": {
              name: "Box 2: Average Performer (Kinerja Standar)",
              color: "slate",
              axis: "Kinerja: Sesuai Ekspektasi | Potensi: Rendah",
              desc: "Pegawai dengan kinerja cukup/standar dan kapasitas potensi rendah. Melaksanakan tugas hanya sebatas instruksi.",
              actions: [
                "Pemantauan kinerja rutin agar tidak merosot ke bawah ekspektasi.",
                "Diberikan bimbingan dasar penyelesaian pekerjaan tepat waktu."
              ]
            },
            "1": {
              name: "Box 1: Underperformer (Butuh Pembinaan Khusus / Sanksi)",
              color: "rose",
              axis: "Kinerja: Di Bawah Ekspektasi | Potensi: Rendah",
              desc: "Pegawai yang gagal mencapai target kinerja minimal dan memiliki indeks potensi sangat rendah. Berisiko menghambat produktivitas satker.",
              actions: [
                "Wajib menjalani pembinaan kinerja intensif dan konseling perilaku kerja.",
                "Diberikan peringatan tertulis sesuai mekanisme PP No. 94/2021 tentang Disiplin PNS.",
                "Bila tidak ada perbaikan dalam masa evaluasi, dilakukan demosi, mutasi, atau tidak diperpanjang perjanjian kerja (untuk PPPK)."
              ]
            }
          };

          function selectBox(boxId) {
            const data = BOX_DATA[boxId];
            if (!data) return;

            // Highlight selected cell
            cells.forEach(c => {
              if (c.getAttribute("data-box") === boxId) {
                c.classList.add("ring-4", "ring-algae-base", "scale-[1.02]");
              } else {
                c.classList.remove("ring-4", "ring-algae-base", "scale-[1.02]");
              }
            });

            // Update Detail Panel
            if (detailPanel) {
              detailPanel.innerHTML = `
                <div class="animate-fade-enter">
                  <div class="flex flex-wrap items-center justify-between gap-2 pb-2 mb-2 border-b border-slate-200">
                    <div>
                      <h5 class="text-xs font-extrabold text-slate-900">${data.name}</h5>
                      <span class="text-[11px] font-mono font-bold text-algae-dark">${data.axis}</span>
                    </div>
                    <span class="text-[10px] font-mono font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-300">
                      Kuadran Box ${boxId}
                    </span>
                  </div>
                  <p class="text-[11px] text-slate-600 leading-relaxed mb-3">${data.desc}</p>
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-200">
                    <span class="text-[11px] font-bold text-slate-800 block mb-1.5">Rekomendasi Tindak Lanjut SDM Kemenag:</span>
                    <ul class="space-y-1 text-[11px] text-slate-600 list-disc list-inside">
                      ${data.actions.map(act => `<li>${act}</li>`).join("")}
                    </ul>
                  </div>
                </div>
              `;
            }

            if (!state.u11_boxes.includes(boxId)) {
              state.u11_boxes.push(boxId);
              saveState();
            }

            const count = Math.min(state.u11_boxes.length, 9);
            if (badge) {
              badge.textContent = `Eksplorasi 9-Box (${count}/9)`;
              if (count >= 3 || isTaskDone(11)) {
                badge.className = "text-xs font-mono font-bold text-emerald-800 px-3 py-1 bg-emerald-100 border border-emerald-300 rounded-full";
                badge.textContent = `Matriks 9-Box Terpetakan (${count}/9) \u2713`;
              }
            }

            if (count >= 3) {
              setTaskCompleted(11);
            }
          }

          cells.forEach(cell => {
            cell.onclick = () => {
              playTone('click');
              const boxId = cell.getAttribute("data-box");
              selectBox(boxId);
            };
          });

          if (simBtn) {
            simBtn.onclick = () => {
              playTone('fanfare');
              state.u11_boxes = ["1", "2", "3", "4", "5", "6", "7", "8", "9"];
              saveState();
              selectBox("9"); // Highlight Top Talent
              confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
              setTaskCompleted(11);
              showToast("Simulasi pemetaan 9-Box lengkap!", "success");
            };
          }

          if (isTaskDone(11)) {
            selectBox("9");
          } else {
            selectBox("9");
          }
        }

        // UNIT 12: Branching Dispute Timeline (\u2b50 Fitur Klien 4)
        if (key === "keberatan") {
          const steps = stage.querySelectorAll("[data-step]");
          const outcome = document.getElementById("disputeOutcomeMessage");

          function applyValidOutcome() {
            const btnA = stage.querySelector('[data-step="1"][data-opt="a"]');
            if (btnA) {
              btnA.className = "p-2.5 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-left text-xs font-bold text-emerald-900 shadow-sm";
            }
            if (outcome) {
              outcome.className = "p-4 rounded-2xl bg-emerald-50 border border-emerald-300 text-emerald-900 text-xs leading-relaxed block";
              outcome.innerHTML = "<strong>Sesuai Prosedur:</strong> Pengajuan hari ke-10 sah secara hukum (di bawah batas 14 hari kalender). Pejabat Penilai Kinerja wajib merespons dalam 14 hari.";
            }
          }

          if (isTaskDone(12)) {
            applyValidOutcome();
          }

          steps.forEach(btn => {
            btn.onclick = () => {
              const step = btn.getAttribute("data-step");
              const opt = btn.getAttribute("data-opt");

              if (step === "1") {
                if (opt === "a") {
                  playTone('success');
                  applyValidOutcome();
                  setTaskCompleted(12);
                  showToast("Skenario sah secara hukum!", "success");
                } else {
                  playTone('error');
                  btn.className = "p-2.5 rounded-xl border-2 border-rose-500 bg-rose-50 text-left text-xs font-bold text-rose-900";
                  if (outcome) {
                    outcome.className = "p-4 rounded-2xl bg-rose-50 border border-rose-300 text-rose-900 text-xs leading-relaxed block";
                    outcome.innerHTML = "<strong>Kadaluwarsa Secara Hukum:</strong> Pengajuan hari ke-15 melampaui batas statuter 14 hari kalender. Keberatan gugur demi hukum! Silakan coba Skenario A.";
                  }
                  showToast("Batas waktu terlampaui. Coba Skenario A.", "error");
                }
              }
            };
          });
        }

        // UNIT 13: Scenario Matching Matrix (\u2b50 Fitur Klien 5)
        if (key === "konsekuensi") {
          if (!state.u13_matches) state.u13_matches = {};
          const scoreBadge = document.getElementById("matchingScoreBadge");
          const autoMatchBtn = document.getElementById("autoMatchAllBtn");
          const selects = stage.querySelectorAll("[data-target]");

          function updateMatchingUI() {
            let correctCount = 0;
            selects.forEach(sel => {
              const targetId = sel.getAttribute("data-target");
              const val = state.u13_matches[targetId] || sel.value;
              if (val) sel.value = val;

              if (val === targetId) {
                correctCount++;
                sel.className = "p-2.5 rounded-xl text-xs font-bold border-2 border-emerald-500 bg-emerald-50 text-emerald-900 shadow-sm";
              } else if (val) {
                sel.className = "p-2.5 rounded-xl text-xs font-bold border-2 border-rose-400 bg-rose-50 text-rose-900";
              }
            });

            if (scoreBadge) {
              scoreBadge.textContent = `Kecocokan Matriks: (${correctCount}/4)`;
              if (correctCount === 4 || isTaskDone(13)) {
                scoreBadge.className = "text-xs font-mono font-bold text-emerald-800 px-3 py-1 bg-emerald-100 border border-emerald-300 rounded-full";
                scoreBadge.textContent = "Kecocokan Matriks (4/4) \u2713";
              }
            }

            if (correctCount === 4) {
              setTaskCompleted(13);
            }
          }

          selects.forEach(sel => {
            sel.onchange = () => {
              const targetId = sel.getAttribute("data-target");
              const val = sel.value;
              state.u13_matches[targetId] = val;
              saveState();

              if (val === targetId) {
                playTone('success');
              } else {
                playTone('error');
              }
              updateMatchingUI();

              const correctCount = Object.keys(state.u13_matches).filter(k => state.u13_matches[k] === k).length;
              if (correctCount === 4) {
                playTone('fanfare');
                confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
                showToast("Matriks Konsekuensi Tuntas Dipetakan!", "success");
              }
            };
          });

          if (autoMatchBtn) {
            autoMatchBtn.onclick = () => {
              playTone('click');
              selects.forEach(sel => {
                const targetId = sel.getAttribute("data-target");
                state.u13_matches[targetId] = targetId;
              });
              saveState();
              updateMatchingUI();
              playTone('fanfare');
              setTaskCompleted(13);
              showToast("Seluruh konsekuensi kinerja berhasil dicocokkan!", "success");
            };
          }

          if (isTaskDone(13)) {
            ["1", "2", "3", "4"].forEach(k => state.u13_matches[k] = k);
          }
          updateMatchingUI();
        }

        // UNIT 14: Kuis Evaluasi Akhir
        if (key === "kuis") {
          renderQuizStage();
        }

        // UNIT 15: Commitment Pledge Card
        if (key === "penutup") {
          const nameInput = stage.querySelector("#pledgeNameInput");
          const satkerInput = stage.querySelector("#pledgeSatkerInput");
          const signBtn = stage.querySelector("#signPledgeBtn");
          const copyBtn = stage.querySelector("#copyPledgeBtn");

          if (nameInput) {
            nameInput.oninput = (e) => {
              state.userName = e.target.value;
              saveState();
            };
          }
          if (satkerInput) {
            satkerInput.oninput = (e) => {
              state.userSatker = e.target.value;
              saveState();
            };
          }
          if (signBtn) {
            signBtn.onclick = () => {
              const name = state.userName.trim() || "Aparatur Sipil Negara";
              state.pledgeSigned = true;
              saveState();
              playTone('fanfare');
              confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
              signBtn.innerHTML = `${renderSvg("award", "w-4 h-4")} <span>Ikrar Kinerja Ditandatangani oleh ${name} ✓</span>`;
              signBtn.className = "px-6 py-2.5 rounded-xl bg-algae-deep text-algae-light font-extrabold shadow-md flex items-center gap-2";
              showToast("Ikrar Komitmen Kinerja berhasil ditandatangani!", "success");
            };
          }
          if (copyBtn) {
            copyBtn.onclick = () => {
              const name = state.userName.trim() || "ASN Kemenag";
              const satker = state.userSatker.trim() || "Kementerian Agama RI";
              const pledgeText = `IKRAR KOMITMEN KINERJA ASN KEMENTERIAN AGAMA RI\n` +
                `Nama: ${name}\n` +
                `Satker: ${satker}\n\n` +
                `1. Berkomitmen menyusun dan menuntaskan RHK yang berdampak nyata bagi organisasi.\n` +
                `2. Mengunggah bukti dukung riil secara berkala dan konsisten di aplikasi e-Kinerja.\n` +
                `3. Aktif menjalin dialog kinerja dua arah dan meminta umpan balik konstruktif pimpinan.\n` +
                `4. Menghayati Core Values BerAKHLAK dalam seluruh pelaksanaan tugas kedinasan.\n` +
                `5. Siap mempertanggungjawabkan capaian kinerja demi pengabdian terbaik bagi umat dan bangsa!`;
              
              navigator.clipboard.writeText(pledgeText).then(() => {
                playTone('success');
                showToast("Teks ikrar disalin ke clipboard", "success");
              }).catch(() => {
                showToast("Gagal menyalin teks", "error");
              });
            };
          }
        }
      }

      /* =========================================================
         GLOBAL KEYBOARD & UI LISTENERS
         ========================================================= */
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        if (e.key === "ArrowRight") {
          if (state.current < UNITS.length - 1 && isTaskDone(state.current) && unitTimeRemaining <= 0) {
            playTone('click');
            markDone(state.current);
            navigateTo(state.current + 1);
          }
        } else if (e.key === "ArrowLeft") {
          if (state.current > 0) {
            playTone('click');
            navigateTo(state.current - 1);
          }
        }
      });

      const mobileToggle = document.getElementById("mobileNavToggle");
      const closeDrawer = document.getElementById("closeDrawer");
      const mobileDrawer = document.getElementById("mobileDrawer");

      if (mobileToggle && mobileDrawer) {
        mobileToggle.onclick = () => {
          playTone('click');
          mobileDrawer.classList.remove("hidden");
        };
      }
      if (closeDrawer && mobileDrawer) {
        closeDrawer.onclick = () => {
          playTone('click');
          mobileDrawer.classList.add("hidden");
        };
      }

      /* =========================================================
         AUDIO NARRATION SYSTEM
         ========================================================= */
      const audioPlayer = document.getElementById("narratorAudio");
      let isAudioPlaying = false;

      function initAudioSystem() {
        if (!audioPlayer) return;

        audioPlayer.onplay = () => {
          isAudioPlaying = true;
          updateAudioUI();
        };

        audioPlayer.onpause = () => {
          isAudioPlaying = false;
          updateAudioUI();
        };

        audioPlayer.onended = () => {
          isAudioPlaying = false;
          updateAudioUI();
        };

        audioPlayer.onerror = () => {
          isAudioPlaying = false;
          updateAudioUI();
        };

        const toggleBtn = document.getElementById("toggleAudioBtn");
        const replayBtn = document.getElementById("replayAudioBtn");

        if (toggleBtn) {
          toggleBtn.onclick = () => {
            playTone('click');
            state.audioEnabled = !state.audioEnabled;
            saveState();
            updateAudioUI();

            if (state.audioEnabled) {
              playUnitNarration(state.current, true);
              showToast("Audio narasi aktif", "success");
            } else {
              audioPlayer.pause();
              showToast("Audio narasi dimatikan", "info");
            }
          };
        }

        if (replayBtn) {
          replayBtn.onclick = () => {
            playTone('click');
            playUnitNarration(state.current, true);
            showToast("Memutar ulang narasi...", "info");
          };
        }

        updateAudioUI();
      }

      function playUnitNarration(unitId, forcePlay = false) {
        if (!audioPlayer) return;
        audioPlayer.pause();

        const audioSrc = `audio/unit_${unitId}.mp3`;
        audioPlayer.src = audioSrc;

        if (state.audioEnabled || forcePlay) {
          audioPlayer.currentTime = 0;
          const playPromise = audioPlayer.play();
          if (playPromise !== undefined) {
            playPromise.catch(err => {
              console.log("Autoplay dicegah browser sebelum interaksi pengguna:", err);
              isAudioPlaying = false;
              updateAudioUI();
            });
          }
        }
      }

      function updateAudioUI() {
        const iconContainer = document.getElementById("audioIconContainer");
        const statusText = document.getElementById("audioStatusText");
        const replayBtn = document.getElementById("replayAudioBtn");
        const toggleBtn = document.getElementById("toggleAudioBtn");

        // Sticky Header Controls
        if (iconContainer) {
          if (state.audioEnabled) {
            iconContainer.innerHTML = renderSvg("volume2", `w-4 h-4 text-algae-dark ${isAudioPlaying ? 'animate-bounce' : ''}`);
          } else {
            iconContainer.innerHTML = renderSvg("volumeX", "w-4 h-4 text-slate-400");
          }
        }

        if (statusText) {
          if (state.audioEnabled) {
            statusText.textContent = isAudioPlaying ? "Narasi: Memutar..." : "Narasi: Aktif";
            statusText.className = "hidden sm:inline text-[11px] font-extrabold text-algae-dark";
          } else {
            statusText.textContent = "Narasi: Nonaktif";
            statusText.className = "hidden sm:inline text-[11px] font-extrabold text-slate-400";
          }
        }

        if (toggleBtn) {
          if (state.audioEnabled) {
            toggleBtn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-algae-light/40 border border-algae-base text-algae-deep transition-all text-xs font-bold shadow-sm";
          } else {
            toggleBtn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white hover:bg-algae-surface border border-slate-200 text-slate-700 transition-all text-xs font-bold shadow-sm";
          }
        }

        if (replayBtn) {
          if (state.audioEnabled) {
            replayBtn.classList.remove("hidden");
          } else {
            replayBtn.classList.add("hidden");
          }
        }

        // Stage Card Audio Pill
        const stageDot = document.getElementById("stageAudioDot");
        const stageText = document.getElementById("stageAudioText");
        const stageBtn = document.getElementById("stageAudioToggleBtn");
        if (stageBtn && stageDot && stageText) {
          if (state.audioEnabled) {
            if (isAudioPlaying) {
              stageBtn.className = "inline-flex items-center gap-1.5 text-[11px] font-bold px-3 py-1 rounded-full bg-algae-light/50 text-algae-deep border border-algae-base shadow-sm animate-pulse";
              stageDot.className = "w-2 h-2 rounded-full bg-algae-base animate-ping";
              stageText.textContent = "Memutar Narasi";
            } else {
              stageBtn.className = "inline-flex items-center gap-1.5 text-[11px] font-bold px-3 py-1 rounded-full bg-algae-surface/80 text-algae-dark border border-slate-200 hover:bg-algae-light/30 shadow-sm";
              stageDot.className = "w-2 h-2 rounded-full bg-algae-base";
              stageText.textContent = "Putar Narasi";
            }
          } else {
            stageBtn.className = "inline-flex items-center gap-1.5 text-[11px] font-bold px-3 py-1 rounded-full bg-slate-100 text-slate-400 border border-slate-200 hover:text-slate-600 shadow-sm";
            stageDot.className = "w-2 h-2 rounded-full bg-slate-300";
            stageText.textContent = "Narasi Mati";
          }
        }

        // Cover Audio Button text
        const coverBtnLabel = document.getElementById("coverAudioBtnLabel");
        if (coverBtnLabel) {
          coverBtnLabel.textContent = (state.audioEnabled && isAudioPlaying) ? "Sedang Memutar..." : "Dengarkan Pengantar";
        }
      }

      /* =========================================================
         ANTI-CHEAT & INTEGRITY GUARDS
         ========================================================= */
      document.addEventListener("contextmenu", (e) => {
        if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
          e.preventDefault();
          showToast("Integritas Ujian: Klik kanan dinonaktifkan.", "info");
        }
      });

      document.addEventListener("keydown", (e) => {
        if (
          e.key === "F12" ||
          (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j" || e.key === "C" || e.key === "c")) ||
          (e.ctrlKey && (e.key === "u" || e.key === "U"))
        ) {
          e.preventDefault();
          showToast("Integritas Ujian: Akses inspeksi dibatasi.", "info");
        }
      });

      /* =========================================================
         INITIALIZATION
         ========================================================= */
      renderNavigation();
      renderStage();
      updateProgressBar();
      initUnitGateTimer(state.current);
      initAudioSystem();
      window.__app = { state, saveState, navigateTo, renderStage, renderNavigation, isTaskDone, setTaskCompleted };
    })();
  </script>
</body>
</html>
