      const CRYPTO_SALT = "kemenag_asn_2026_mkmb";

      // Lightweight, standalone Pure JS SHA-256 (RFC 6234 compliant, zero dependencies)
      function sha256(ascii) {
        function rightRotate(value, amount) {
          return (value >>> amount) | (value << (32 - amount));
        }
        var mathPow = Math.pow;
        var maxWord = mathPow(2, 32);
        var lengthProperty = 'length';
        var i, j;
        var result = '';
        var words = [];
        var asciiBitLength = ascii[lengthProperty] * 8;
        var hash = [];
        var k = [];
        var primeCounter = 0;
        var isComposite = {};
        for (var candidate = 2; primeCounter < 64; candidate++) {
          if (!isComposite[candidate]) {
            for (i = 0; i < 313; i += candidate) {
              isComposite[i] = candidate;
            }
            hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
            k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
          }
        }
        ascii += '\x80';
        while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
        for (i = 0; i < ascii[lengthProperty]; i++) {
          j = ascii.charCodeAt(i);
          if (j >> 8) return;
          words[i >> 2] |= j << ((3 - i) % 4) * 8;
        }
        words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
        words[words[lengthProperty]] = (asciiBitLength | 0);
        for (j = 0; j < words[lengthProperty];) {
          var w = words.slice(j, j += 16);
          var oldHash = hash;
          hash = hash.slice(0, 8);
          for (i = 0; i < 64; i++) {
            var w15 = w[i - 15], w2 = w[i - 2];
            var s0 = rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3);
            var s1 = rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10);
            var ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
            var temp1 = hash[7] + (rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25)) + ch + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + s0 + w[i - 7] + s1) | 0);
            var maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
            var temp2 = (rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22)) + maj;
            hash = [(temp1 + temp2) | 0].concat(hash);
            hash[4] = (hash[4] + temp1) | 0;
          }
          for (i = 0; i < 8; i++) {
            hash[i] = (hash[i] + oldHash[i]) | 0;
          }
        }
        for (i = 0; i < 8; i++) {
          for (j = 3; j >= 0; j--) {
            var b = (hash[i] >> (8 * j)) & 255;
            result += ((b < 16) ? '0' : '') + b.toString(16);
          }
        }
        return result;
      }

      // Decrypt hex ciphertext using matching SHA-256 key
      function decryptHex(hexStr, keyHash) {
        try {
          const bytes = new Uint8Array(hexStr.length / 2);
          for (let i = 0; i < hexStr.length; i += 2) {
            const b = parseInt(hexStr.substr(i, 2), 16);
            const k = keyHash.charCodeAt((i / 2) % keyHash.length);
            bytes[i / 2] = b ^ k;
          }
          return new TextDecoder().decode(bytes);

    /* =========================================================
       STATE & LOCK GATE MANAGEMENT
       ========================================================= */
    const STORAGE_KEY = "kemenag_pj_lock_v5";
    let state = loadState();

    let unitTimerInterval = null;
    let unitTimeRemaining = 10;

    function computeStateSignature(data) {
      const payload = `${data.current}::${(data.done || []).join(',')}::${JSON.stringify(data.tasksDone || {})}`;
      return sha256(`kemenag_asn_2026_mkmb::sig::${payload}`);
    }

    function loadState() {
      const defaults = { 
        current: 0, 
        done: [0], 
        tasksDone: { 0: true, 1: true }, 
        bookmarkedJF: [],
        u4_kw: [],
        u7_flips: [],
        audioEnabled: false
      };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed) {
            if (parsed.sig) {
              const expectedSig = computeStateSignature(parsed);
              if (parsed.sig === expectedSig) {
                return Object.assign(defaults, parsed);
              } else {
                console.warn("Manipulasi progres terdeteksi. Mengatur ulang ke status aman.");
              }
            } else {
              parsed.sig = computeStateSignature(parsed);
              return Object.assign(defaults, parsed);
            }
          }
        }
      } catch (e) {}
      defaults.sig = computeStateSignature(defaults);
      return defaults;
    }

    function saveState() {
      try {
        state.sig = computeStateSignature(state);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function isDone(id) {
      return state.done.includes(id);
    }

    function isTaskDone(id) {
      if (!UNITS[id].reqTask) return true;
      if (isDone(id)) return true;
      return !!(state.tasksDone && state.tasksDone[id]);
    }

    function setTaskCompleted(id) {
      if (!state.tasksDone) state.tasksDone = {};
      state.tasksDone[id] = true;
      saveState();
      updateGateUI();
      playTone('success');
      showToast("Tugas interaksi selesai!", "success");
    }

    function canAccess(id) {
      if (id === 0 || id === 1) return true;
      return isDone(id - 1) || isDone(id) || id <= Math.max(...state.done) + 1;
    }

    function markDone(id) {
      if (!state.done.includes(id)) state.done.push(id);
      saveState();
      renderNavigation();
      updateProgressBar();
    }

    function updateProgressBar() {
      const pct = Math.round((state.done.length / UNITS.length) * 100);
      const fill = document.getElementById("progressFill");
      const label = document.getElementById("pctLabel");
      if (fill) fill.style.width = pct + "%";
      if (label) label.textContent = pct + "%";
    }

    function showToast(msg, type = "info") {
      const el = document.getElementById("toast");
      if (!el) return;

      const styles = {
        success: "bg-algae-dark text-white ring-2 ring-algae-light",
        error: "bg-rose-700 text-white ring-2 ring-rose-300",
        info: "bg-algae-deep text-white ring-2 ring-algae-base"
      }[type] || "bg-algae-dark text-white";

      el.className = `fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-sm font-semibold transition-all duration-500 transform ${styles}`;
      el.innerHTML = `
        <span class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold shrink-0">
          ${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}
        </span>
        <span>${msg}</span>
      `;

      el.classList.remove("translate-y-24", "opacity-0", "pointer-events-none");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => {
        el.classList.add("translate-y-24", "opacity-0", "pointer-events-none");
      }, 2500);
    }

    /* =========================================================
       GATE TIMER & STATUS CONTROLLER
       ========================================================= */
    function initUnitGateTimer(unitId) {
      if (unitTimerInterval) {
        clearInterval(unitTimerInterval);
        unitTimerInterval = null;
      }

      // If unit is already completed or it is the penutup stage, allow instant navigation
      if (isDone(unitId) || unitId === UNITS.length - 1) {
        unitTimeRemaining = 0;
      } else {
        unitTimeRemaining = 10;
      }

      updateGateUI();

      if (unitTimeRemaining > 0) {
        unitTimerInterval = setInterval(() => {
          unitTimeRemaining--;
          updateGateUI();
          if (unitTimeRemaining <= 0) {
            clearInterval(unitTimerInterval);
            unitTimerInterval = null;
          }
        }, 1000);
      }
    }

    function updateGateUI() {
      const nextBtn = document.querySelector('[data-action="next"]');
      const gateStatus = document.getElementById("gateStatus");
      if (!nextBtn) return;

      const currentId = state.current;
      const taskCompleted = isTaskDone(currentId);
      const timeCompleted = unitTimeRemaining <= 0;

      // Condition 1 (Priority): Task Completion
      if (!taskCompleted) {
        nextBtn.disabled = true;
        if (gateStatus) {
          gateStatus.innerHTML = `
            <div class="flex items-center gap-2 text-rose-700 bg-rose-50 border border-rose-200 px-3.5 py-1.5 rounded-2xl text-xs font-bold shadow-sm">
              ${renderSvg("lock", "w-4 h-4 text-rose-600")}
              <span>Kerjakan aktivitas wajib di unit ini</span>
              ${unitTimeRemaining > 0 ? `<span class="text-[10px] text-slate-400 font-mono">(${unitTimeRemaining}s)</span>` : ''}
            </div>
          `;
        }
      } 
      // Condition 2: 10-Second Time Gate
      else if (!timeCompleted) {
        nextBtn.disabled = true;
        if (gateStatus) {
          gateStatus.innerHTML = `
            <div class="flex items-center gap-2 text-algae-deep bg-algae-light/30 border border-algae-base px-3.5 py-1.5 rounded-2xl text-xs font-bold shadow-sm">
              ${renderSvg("clock", "w-4 h-4 text-algae-dark")}
              <span>Membaca modul: <strong class="font-mono text-algae-dark text-sm">${unitTimeRemaining}</strong> detik lagi</span>
            </div>
          `;
        }
      } 
      // Both Conditions Satisfied
      else {
        nextBtn.disabled = false;
        if (gateStatus) {
          gateStatus.innerHTML = `
            <div class="flex items-center gap-2 text-algae-dark bg-algae-light/40 border border-algae-base px-3.5 py-1.5 rounded-2xl text-xs font-extrabold shadow-sm animate-pulse">
              ${renderSvg("checkCircle", "w-4 h-4 text-algae-dark")}
              <span>Syarat terpenuhi, silakan lanjut!</span>
            </div>
          `;
        }
      }
    }

    /* =========================================================
       NAVIGATION SYSTEM
       ========================================================= */
    function renderNavigation() {
      const desktopNav = document.getElementById("desktopNav");
      const mobileNav = document.getElementById("mobileNav");
      if (!desktopNav || !mobileNav) return;

      const itemHtml = (u) => {
        const active = state.current === u.id;
        const completed = isDone(u.id);
        const accessible = canAccess(u.id);

        let badgeCls = "bg-algae-surface text-slate-500";
        if (active) badgeCls = "bg-algae-dark text-white font-bold";
        else if (completed) badgeCls = "bg-algae-base text-white";

        return `
          <button type="button" 
                  data-unit="${u.id}" 
                  ${accessible ? "" : "disabled"}
                  class="w-full group flex items-center justify-between p-2.5 rounded-2xl text-left transition-all duration-500 border ${
                    active 
                      ? "bg-algae-light/30 border-algae-base text-algae-deep shadow-sm" 
                      : completed 
                        ? "bg-white hover:bg-algae-canvas border-algae-surface text-slate-700" 
                        : accessible 
                          ? "bg-white hover:bg-algae-canvas border-transparent text-slate-500" 
                          : "opacity-40 cursor-not-allowed border-transparent text-slate-400"
                  }">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="w-6 h-6 rounded-xl text-[11px] font-mono flex items-center justify-center shrink-0 ${badgeCls} transition-colors">
                ${completed && !active ? "✓" : String(u.id).padStart(2, "0")}
              </span>
              <span class="text-xs font-semibold truncate ${active ? "font-extrabold text-algae-deep" : "text-slate-700"}">
                ${u.nav}
              </span>
            </div>
            
            <div class="shrink-0 text-slate-400 group-hover:text-algae-dark group-hover:scale-110 transition-transform">
              ${renderSvg(u.icon, "w-4 h-4")}
            </div>
          </button>
        `;
      };

      const html = UNITS.map(itemHtml).join("");
      desktopNav.innerHTML = html;
      mobileNav.innerHTML = html;

      const clickHandler = (e) => {
        const btn = e.target.closest("[data-unit]");
        if (!btn || btn.hasAttribute("disabled")) return;
        playTone('click');
        navigateTo(Number(btn.dataset.unit));
        document.getElementById("mobileDrawer").classList.add("hidden");
      };

      desktopNav.onclick = clickHandler;
      mobileNav.onclick = clickHandler;
    }

    function navigateTo(id) {
      if (id < 0 || id >= UNITS.length) return;
      state.current = id;
      saveState();
      renderNavigation();
      renderStage();
      updateProgressBar();
      initUnitGateTimer(id);
      playUnitNarration(id);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    let quizState = {
      index: 0,
      userAnswers: [],

    function resetQuizState() {
      quizState = {
        index: 0,
        userAnswers: [],
        score: 0,
        isFinished: false
      };
    }

    function renderQuizStage() {
      const container = document.getElementById("quizContainer");
      if (!container) return;

      if (quizState.isFinished) {
        const pct = Math.round((quizState.score / QUIZ_ITEMS.length) * 100);
        const passed = pct >= 75;

        if (passed) {
          markDone(9);
          setTaskCompleted(9);
          playTone('fanfare');
          confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
        } else {
          playTone('error');
        }

        container.innerHTML = `
          <div class="text-center py-6 space-y-4 max-w-md mx-auto my-auto">
            <div class="w-24 h-24 mx-auto rounded-full ${passed ? "bg-algae-light/30 text-algae-dark border-4 border-algae-base" : "bg-rose-50 text-rose-600 border-4 border-rose-300"} flex items-center justify-center font-extrabold text-3xl font-mono shadow-sm">
              ${pct}%
            </div>
            
            <div>
              <h3 class="text-xl font-extrabold text-algae-deep">${passed ? "Selamat, Anda Lulus Evaluasi!" : "Belum Mencapai Nilai Kelulusan"}</h3>
              <p class="text-xs text-slate-600 mt-1">
                ${passed 
                  ? `Skor Anda ${quizState.score} dari ${QUIZ_ITEMS.length} soal benar. Anda telah memenuhi standar kompetensi orientasi.` 
                  : `Skor Anda ${quizState.score} dari ${QUIZ_ITEMS.length} soal benar. Anda memerlukan minimal 6 jawaban benar (75%) untuk membuka penutup.`}
              </p>
            </div>

            <div class="flex items-center justify-center gap-3 pt-2">
              <button type="button" id="retryQuizBtn" class="px-5 py-2.5 rounded-2xl border border-slate-300 text-slate-700 hover:bg-algae-surface text-xs font-bold transition-all">
                Ulangi Kuis
              </button>
              ${passed ? `
                <button type="button" data-action="next" class="px-6 py-2.5 rounded-2xl bg-algae-dark text-white text-xs font-bold hover:bg-algae-deep shadow-md transition-all">
                  Lanjut ke Penutup
                </button>
              ` : ""}
            </div>
          </div>
        `;

        const retryBtn = document.getElementById("retryQuizBtn");
        if (retryBtn) {
          retryBtn.onclick = () => {
            playTone('click');
            resetQuizState();
            renderQuizStage();
          };
        }

        const nextToPenutupBtn = container.querySelector('[data-action="next"]');
        if (nextToPenutupBtn) {
          nextToPenutupBtn.onclick = () => {
            playTone('click');
            markDone(9);
            navigateTo(10);
          };
        }
        return;
      }

      const cur = QUIZ_ITEMS[quizState.index];
      const isAnswered = quizState.userAnswers[quizState.index] !== undefined;
      const userSelected = quizState.userAnswers[quizState.index];
      const userAnsHash = isAnswered ? sha256(`kemenag_asn_2026_mkmb::quiz_${quizState.index}::${userSelected}`) : null;
      const isUserCorrect = isAnswered && (userAnsHash === cur.hash);
      const decryptedExplain = isUserCorrect ? decryptHex(cur.encExplain, cur.hash) : "Jawaban kurang tepat. Cermati kembali materi orientasi pada unit sebelumnya sebelum melanjutkan.";

      const dots = QUIZ_ITEMS.map((item, i) => {
        let cls = "bg-algae-surface text-slate-600";
        if (i === quizState.index) {
          cls = "bg-algae-base text-white ring-2 ring-algae-light font-bold";
        } else if (quizState.userAnswers[i] !== undefined) {
          const ansHash = sha256(`kemenag_asn_2026_mkmb::quiz_${i}::${quizState.userAnswers[i]}`);

        return `<span class="w-6 h-6 rounded-lg text-[11px] font-mono flex items-center justify-center ${cls}">${i + 1}</span>`;

      container.innerHTML = `

            ${cur.options.map((opt, optIdx) => {

              const optHash = sha256(`kemenag_asn_2026_mkmb::quiz_${quizState.index}::${optIdx}`);
              const isThisOptCorrect = (optHash === cur.hash);

              if (isAnswered) {
                if (isThisOptCorrect) {
                  optStyle = "bg-algae-light/40 border-algae-base text-algae-deep font-extrabold";
                } else if (optIdx === userSelected && !isUserCorrect) {
                  optStyle = "bg-rose-50 border-rose-300 text-rose-800 font-extrabold";
                } else {
                  optStyle = "bg-white opacity-40 border-slate-200 text-slate-400";
                }
              }
              return `
                <button type="button" 
                        data-opt="${optIdx}" 
                        ${isAnswered ? "disabled" : ""}
                        class="w-full text-left p-3.5 rounded-2xl border text-xs sm:text-sm font-medium transition-all flex items-center justify-between ${optStyle}">
                  <span>${opt}</span>
                  ${isAnswered && isThisOptCorrect ? `<span class="font-bold text-algae-dark text-xs">✓ Benar</span>` : ""}
                  ${isAnswered && optIdx === userSelected && !isUserCorrect ? `<span class="font-bold text-rose-600 text-xs">✕ Salah</span>` : ""}
                </button>
              `;
            }).join("")}
          </div>

          ${isAnswered ? `
            <div class="p-4 rounded-2xl ${isUserCorrect ? "bg-algae-light/30 border border-algae-base/40 text-algae-deep" : "bg-rose-50 border border-rose-200 text-rose-900"} text-xs leading-relaxed mb-4 font-medium">
              <strong>Pembahasan:</strong> ${decryptedExplain}
            </div>
          ` : ""}
        </div>

        <div class="pt-4 border-t border-algae-surface flex items-center justify-between">
          <button type="button" id="prevQuizBtn" ${quizState.index === 0 ? "disabled" : ""} class="px-4 py-2 rounded-2xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-algae-surface disabled:opacity-30 disabled:cursor-not-allowed">
            ← Soal Sebelumnya
          </button>
          
          ${isAnswered ? `
            <button type="button" id="nextQuizBtn" class="px-6 py-2.5 rounded-2xl bg-algae-dark text-white text-xs font-bold hover:bg-algae-deep shadow-md transition-all">
              ${quizState.index === QUIZ_ITEMS.length - 1 ? "Lihat Hasil Kuis" : "Soal Selanjutnya →"}
            </button>
          ` : `<span class="text-[11px] text-slate-400 italic">Pilih satu opsi jawaban</span>`}
        </div>
      `;

      const options = container.querySelectorAll("[data-opt]");
      options.forEach(btn => {
        btn.onclick = () => {
          const picked = Number(btn.dataset.opt);
          quizState.userAnswers[quizState.index] = picked;
          const candidateHash = sha256(`kemenag_asn_2026_mkmb::quiz_${quizState.index}::${picked}`);
          if (candidateHash === cur.hash) {
            playTone('success');
            quizState.score++;
            showToast("Jawaban Benar!", "success");
          } else {
            playTone('error');
            showToast("Jawaban Kurang Tepat", "error");
          }
          renderQuizStage();
        };
      });

      const nextBtn = document.getElementById("nextQuizBtn");
      if (nextBtn) {
        nextBtn.onclick = () => {
          playTone('click');
          if (quizState.index < QUIZ_ITEMS.length - 1) {
            quizState.index++;
            renderQuizStage();
          } else {
            quizState.isFinished = true;
            renderQuizStage();
          }
        };
      }

      const prevBtn = document.getElementById("prevQuizBtn");
      if (prevBtn) {
        prevBtn.onclick = () => {
          playTone('click');
          if (quizState.index > 0) {
            quizState.index--;
            renderQuizStage();
          }
        };
      }
    }

    /* =========================================================
       STAGE EVENT HANDLERS & ANIMATIONS
       ========================================================= */
    function renderStage() {
      const stage = document.getElementById("stage");
      const unit = UNITS[state.current];
      if (!stage || !unit) return;

      const renderer = UNIT_RENDERERS[unit.key];
      stage.innerHTML = renderer ? renderer() : `<p class="text-sm text-slate-500">Unit belum tersedia.</p>`;

      bindStageEvents(unit.key);
      updateAudioUI();
    }

    function bindStageEvents(key) {
      const stage = document.getElementById("stage");

      // Global Navigation Triggers
      stage.querySelectorAll('[data-action="start"]').forEach(b => {
        b.onclick = () => { 
          playTone('click');
          markDone(0); 
          setTaskCompleted(0);
          state.audioEnabled = true;
          saveState();
          updateAudioUI();
          navigateTo(1); 
        };
      });

      // Cover Audio Preview Button
      const coverAudioBtn = stage.querySelector("#coverAudioBtn");
      if (coverAudioBtn) {
        coverAudioBtn.onclick = () => {
          playTone('click');
          state.audioEnabled = true;
          saveState();
          updateAudioUI();
          playUnitNarration(0, true);
          showToast("Memutar narasi pengantar...", "info");
        };
      }

      // Stage Header Audio Pill Toggle
      const stageAudioBtn = stage.querySelector("#stageAudioToggleBtn");
      if (stageAudioBtn) {
        stageAudioBtn.onclick = () => {
          playTone('click');
          state.audioEnabled = !state.audioEnabled;
          saveState();
          updateAudioUI();
          if (state.audioEnabled) {
            playUnitNarration(state.current, true);
            showToast("Audio narasi aktif", "success");
          } else {
            if (audioPlayer) audioPlayer.pause();
            showToast("Audio narasi dimatikan", "info");
          }
        };
      }

      stage.querySelectorAll('[data-action="next"]').forEach(b => {
        b.onclick = () => {
          if (state.current === UNITS.length - 1) {
            playTone('success');
            markDone(state.current);
            navigateTo(0);
            return;
          }
          if (isTaskDone(state.current) && unitTimeRemaining <= 0) {
            playTone('click');
            markDone(state.current);
            navigateTo(state.current + 1);
          }
        };
      });
      stage.querySelectorAll('[data-action="prev"]').forEach(b => {
        b.onclick = () => {
          playTone('click');
          navigateTo(state.current - 1);
        };
      });
      stage.querySelectorAll('[data-action="restart"]').forEach(b => {
        b.onclick = () => {
          playTone('click');
          state = { 
            current: 0, 
            done: [0], 
            tasksDone: { 0: true, 1: true }, 
            bookmarkedJF: [],
            u4_kw: [],

          navigateTo(0);

      stage.querySelectorAll('[data-jump]').forEach(b => {

          playTone('click');
          navigateTo(Number(b.dataset.jump));
        };
      });

      // UNIT 2: Animated Number Counters + Micro Quiz Task
      if (key === "skala") {
        const counters = stage.querySelectorAll(".counter");
        counters.forEach(c => {
          const target = Number(c.dataset.target);
          const duration = 2200;
          const start = performance.now();
          function tick(now) {
            const progress = Math.min(1, (now - start) / duration);
            const ease = 1 - Math.pow(1 - progress, 3);
            c.textContent = formatNumber(Math.round(target * ease));
            if (progress < 1) requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        });

        const quizBtns = stage.querySelectorAll("#microQuizUnit2 button");
        const fb = document.getElementById("feedbackUnit2");

        let sorted = false;
        const sortBtn = document.getElementById("sortPct");
        if (sortBtn) {
          sortBtn.onclick = () => {
            playTone('click');
            sorted = !sorted;
            const sortedData = [...JF_DATA].sort((a, b) => sorted ? a.name.localeCompare(b.name) : b.pct - a.pct);
            sortBtn.querySelector("span").textContent = sorted ? "Urutkan: Alfabet" : "Urutkan: Tertinggi";
            renderBars(sortedData);
          };
        }

        const chipsGrid = document.getElementById("jfChipsGrid");
        const countLabel = document.getElementById("jfResultCount");
        const searchInput = document.getElementById("jfSearchInput");

        const renderChips = (query = "") => {
          if (!chipsGrid) return;
          const filtered = ALL_55_JF.filter(n => n.toLowerCase().includes(query.toLowerCase()));
          countLabel.textContent = `${filtered.length} Jabatan`;

          chipsGrid.innerHTML = filtered.map(name => {
            const isBookmarked = (state.bookmarkedJF || []).includes(name);
            return `
              <button type="button" 
                      data-jf="${name}" 
                      class="px-3 py-1.5 rounded-2xl text-xs font-semibold transition-all flex items-center gap-1.5 ${
                        isBookmarked 
                          ? "bg-algae-dark text-white shadow-sm ring-2 ring-algae-light" 
                          : "bg-white hover:bg-algae-surface border border-slate-200 text-slate-700"
                      }">
                <span>${name}</span>
                <span class="text-[10px] opacity-75">${isBookmarked ? "★" : "☆"}</span>
              </button>
            `;
          }).join("");

          chipsGrid.querySelectorAll("[data-jf]").forEach(btn => {
            btn.onclick = () => {
              playTone('click');
              const jfName = btn.dataset.jf;
              if (!state.bookmarkedJF) state.bookmarkedJF = [];
              if (state.bookmarkedJF.includes(jfName)) {
                state.bookmarkedJF = state.bookmarkedJF.filter(x => x !== jfName);
                showToast(`Hapus tanda: ${jfName}`, "info");
              } else {
                state.bookmarkedJF.push(jfName);
                showToast(`Ditandai: ${jfName}`, "success");
              }
              saveState();
              renderChips(searchInput ? searchInput.value : "");
              setTaskCompleted(6);
            };
          });
        };
        renderChips();

        if (searchInput) {
          searchInput.oninput = (e) => {
            renderChips(e.target.value.trim());
            if (e.target.value.trim().length > 0) {
              setTaskCompleted(6);
            }
          };
        }
      }

      // UNIT 7: Flip Cards (Must flip all 4)
      if (key === "pensiun") {
        if (!state.u7_flips) state.u7_flips = [];
        const flipLabel = document.getElementById("flipCounterLabel");

        stage.querySelectorAll(".flip-card").forEach(card => {
          card.onclick = () => {
            playTone('click');
            const inner = card.querySelector(".flip-inner");
            const cardId = card.dataset.card;
            const isFlipped = card.dataset.flipped === "true";
            if (isFlipped) {
              inner.classList.remove("rotate-y-180");
              card.dataset.flipped = "false";
            } else {
              inner.classList.add("rotate-y-180");
              card.dataset.flipped = "true";
              if (!state.u7_flips.includes(cardId)) {
                state.u7_flips.push(cardId);
                saveState();
              }
              if (flipLabel) {
                flipLabel.textContent = `Balik 4 Kartu (${state.u7_flips.length}/4)`;
              }
              if (state.u7_flips.length >= 4) {
                setTaskCompleted(7);
              }
            }
          };
        });

        const slider = document.getElementById("ageSlider");
        const ageLabel = document.getElementById("sliderAgeLabel");
        if (slider && ageLabel) {
          slider.oninput = (e) => {
            ageLabel.textContent = `Usia ${e.target.value} Tahun`;
          };
        }
      }

      // UNIT 8: Scenario Matcher (Must complete 3 scenarios)
      if (key === "pindah") {
        const scenarioItems = stage.querySelectorAll(".scenario-item");
        const scenarioFb = document.getElementById("scenarioFeedback");
        let answeredCount = 0;
        const SCENARIO_HASHES = {
          "0": "7060679b48effd47d93ef5e263df148134e2bcd3bc5289be206ea786ba6fc2d0",
          "1": "bc3c623a05b5cc3494208107136633f6a633d40dca0e51cdabaea85ffbdf20f2",
          "2": "197e8dc79b0bb44a23a0fb4609498eaedac1bca706bcc658a7f4270d96f25847"
        };

        scenarioItems.forEach(item => {
          const sId = item.dataset.scenario;
          const expectedHash = SCENARIO_HASHES[sId];
          item.querySelectorAll("button").forEach(btn => {
            btn.onclick = () => {
              const val = btn.dataset.val;
              const isCorrect = sha256(`kemenag_asn_2026_mkmb::unit_8_${sId}::${val}`) === expectedHash;
              if (isCorrect) {
                playTone('success');
              } else {
                playTone('error');
              }
              item.querySelectorAll("button").forEach(b => {
                b.disabled = true;
                b.className = "px-3.5 py-1.5 text-xs font-bold rounded-xl border text-slate-400 bg-algae-surface/50";
              });
              if (isCorrect) {
                btn.className = "px-3.5 py-1.5 text-xs font-bold rounded-xl bg-algae-dark text-white shadow-sm";
                item.classList.add("border-algae-base", "bg-algae-light/20");
                showToast("Pilihan Tepat!", "success");
              } else {
                btn.className = "px-3.5 py-1.5 text-xs font-bold rounded-xl bg-rose-600 text-white";
                item.classList.add("border-rose-300", "bg-rose-50/50");
                showToast("Pilihan Kurang Tepat", "error");
              }

              answeredCount++;
              if (answeredCount >= 3) {
                if (scenarioFb) {
                  scenarioFb.classList.remove("hidden");
                  scenarioFb.className = "mt-3 text-xs font-bold text-algae-dark p-3 rounded-2xl bg-algae-light/30 border border-algae-base/40";
                  scenarioFb.textContent = "✓ Selesai! Anda telah menyelesaikan seluruh skenario mobilitas karir.";
                }
                setTaskCompleted(8);
              }
            };
          });
        });
      }

      // UNIT 9: Kuis Evaluasi
      if (key === "kuis") {
        renderQuizStage();
      }
    }

    /* =========================================================
       GLOBAL KEYBOARD & UI LISTENERS
       ========================================================= */
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "ArrowRight") {
        if (state.current < UNITS.length - 1 && isTaskDone(state.current) && unitTimeRemaining <= 0) {
          markDone(state.current);
          navigateTo(state.current + 1);
        }
      } else if (e.key === "ArrowLeft") {
        if (state.current > 0) {
          navigateTo(state.current - 1);
        }
      }
    });

    const mobileToggle = document.getElementById("mobileNavToggle");
    const closeDrawer = document.getElementById("closeDrawer");
    const mobileDrawer = document.getElementById("mobileDrawer");

    if (mobileToggle && mobileDrawer) {
      mobileToggle.onclick = () => mobileDrawer.classList.remove("hidden");
    }
    if (closeDrawer && mobileDrawer) {
      closeDrawer.onclick = () => mobileDrawer.classList.add("hidden");
    }

    /* =========================================================
       TACTILE SOUND SYNTHESIZER (Web Audio API)
       ========================================================= */
    let audioCtx = null;
    function playTone(type) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        if (type === 'click') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(650, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.04);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'success') {
          [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.07);
            gain.gain.setValueAtTime(0.09, now + i * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.07);
            osc.stop(now + i * 0.07 + 0.22);
          });
        } else if (type === 'error') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.linearRampToValueAtTime(130, now + 0.14);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.09);
            gain.gain.setValueAtTime(0.12, now + i * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.09);
            osc.stop(now + i * 0.09 + 0.35);
          });
        }
      } catch (e) {
        // Fallback gracefully if Web Audio is restricted by browser policy
      }
    }

    /* =========================================================
       AUDIO NARRATION SYSTEM
       ========================================================= */
    const audioPlayer = document.getElementById("narratorAudio");
    let isAudioPlaying = false;

    function initAudioSystem() {
      if (!audioPlayer) return;

      audioPlayer.onplay = () => {
        isAudioPlaying = true;
        updateAudioUI();
      };

      audioPlayer.onpause = () => {
        isAudioPlaying = false;
        updateAudioUI();
      };

      audioPlayer.onended = () => {
        isAudioPlaying = false;
        updateAudioUI();
      };

      audioPlayer.onerror = () => {
        isAudioPlaying = false;
        updateAudioUI();
      };

      const toggleBtn = document.getElementById("toggleAudioBtn");
      const replayBtn = document.getElementById("replayAudioBtn");

      if (toggleBtn) {
        toggleBtn.onclick = () => {
          state.audioEnabled = !state.audioEnabled;
          saveState();
          updateAudioUI();

          if (state.audioEnabled) {
            playUnitNarration(state.current, true);
            showToast("Audio narasi aktif", "success");
          } else {
            audioPlayer.pause();
            showToast("Audio narasi dimatikan", "info");
          }
        };
      }

      if (replayBtn) {
        replayBtn.onclick = () => {
          playUnitNarration(state.current, true);
          showToast("Memutar ulang narasi...", "info");
        };
      }

      updateAudioUI();
    }

    function playUnitNarration(unitId, forcePlay = false) {
      if (!audioPlayer) return;
      audioPlayer.pause();

      const audioSrc = `audio/unit_${unitId}.mp3`;
      audioPlayer.src = audioSrc;

      if (state.audioEnabled || forcePlay) {
        audioPlayer.currentTime = 0;
        const playPromise = audioPlayer.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.log("Autoplay dicegah browser sebelum interaksi pengguna:", err);
            isAudioPlaying = false;
            updateAudioUI();
          });
        }
      }
    }

    function updateAudioUI() {
      const iconContainer = document.getElementById("audioIconContainer");
      const statusText = document.getElementById("audioStatusText");
      const replayBtn = document.getElementById("replayAudioBtn");
      const toggleBtn = document.getElementById("toggleAudioBtn");

      // Sticky Header Controls
      if (iconContainer) {
        if (state.audioEnabled) {
          iconContainer.innerHTML = renderSvg("volume2", `w-4 h-4 text-algae-dark ${isAudioPlaying ? 'animate-bounce' : ''}`);
        } else {
          iconContainer.innerHTML = renderSvg("volumeX", "w-4 h-4 text-slate-400");
        }
      }

      if (statusText) {
        if (state.audioEnabled) {
          statusText.textContent = isAudioPlaying ? "Narasi: Memutar..." : "Narasi: Aktif";
          statusText.className = "hidden sm:inline text-[11px] font-extrabold text-algae-dark";
        } else {
          statusText.textContent = "Narasi: Nonaktif";
          statusText.className = "hidden sm:inline text-[11px] font-extrabold text-slate-400";
        }
      }

      if (toggleBtn) {
        if (state.audioEnabled) {
          toggleBtn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-algae-light/40 border border-algae-base text-algae-deep transition-all text-xs font-bold shadow-sm";
        } else {
          toggleBtn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white hover:bg-algae-surface border border-slate-200 text-slate-700 transition-all text-xs font-bold shadow-sm";
        }
      }

      if (replayBtn) {
        if (state.audioEnabled) {
          replayBtn.classList.remove("hidden");
        } else {
          replayBtn.classList.add("hidden");
        }
      }

      // Stage Card Audio Pill
      const stageDot = document.getElementById("stageAudioDot");
      const stageText = document.getElementById("stageAudioText");
      const stageBtn = document.getElementById("stageAudioToggleBtn");
      if (stageBtn && stageDot && stageText) {
        if (state.audioEnabled) {
          if (isAudioPlaying) {
            stageBtn.className = "inline-flex items-center gap-1.5 text-[11px] font-bold px-3 py-1 rounded-full bg-algae-light/50 text-algae-deep border border-algae-base shadow-sm animate-pulse";
            stageDot.className = "w-2 h-2 rounded-full bg-algae-base animate-ping";
            stageText.textContent = "Memutar Narasi";
          } else {
            stageBtn.className = "inline-flex items-center gap-1.5 text-[11px] font-bold px-3 py-1 rounded-full bg-algae-surface/80 text-algae-dark border border-slate-200 hover:bg-algae-light/30 shadow-sm";
            stageDot.className = "w-2 h-2 rounded-full bg-algae-base";
            stageText.textContent = "Putar Narasi";
          }
        } else {
          stageBtn.className = "inline-flex items-center gap-1.5 text-[11px] font-bold px-3 py-1 rounded-full bg-slate-100 text-slate-400 border border-slate-200 hover:text-slate-600 shadow-sm";
          stageDot.className = "w-2 h-2 rounded-full bg-slate-300";
          stageText.textContent = "Narasi Mati";
        }
      }

      // Cover Audio Button text
      const coverBtnLabel = document.getElementById("coverAudioBtnLabel");
      if (coverBtnLabel) {
        coverBtnLabel.textContent = (state.audioEnabled && isAudioPlaying) ? "Sedang Memutar..." : "Dengarkan Pengantar";
      }
    }

    /* =========================================================
       ANTI-CHEAT & INTEGRITY GUARDS
       ========================================================= */
    document.addEventListener("contextmenu", (e) => {
      if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
        e.preventDefault();
        showToast("Integritas Ujian: Klik kanan dinonaktifkan.", "info");
      }
    });

    document.addEventListener("keydown", (e) => {
      // Prevent F12, Ctrl+Shift+I/J/C, Ctrl+U
      if (
        e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j" || e.key === "C" || e.key === "c")) ||
        (e.ctrlKey && (e.key === "u" || e.key === "U"))
      ) {
        e.preventDefault();
        showToast("Integritas Ujian: Akses inspeksi dibatasi.", "info");
      }
    });

    /* =========================================================
       INITIALIZATION
       ========================================================= */
    renderNavigation();
    renderStage();
    updateProgressBar();
    initUnitGateTimer(state.current);
    initAudioSystem();
  })();
  </script>
</body>
</html>
